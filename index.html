<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyedim</title>
<meta name="description" content="Eyedim: free Windows tray utility for brightness, night light and contrast. Open source.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#0e1626;--panel:#162238;--line:#26364f;--text:#e8edf5;--mute:#9fb0c8;--amber:#f2a93b;--amber-d:#c9851a;--ink:#1a1204;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 Onest,system-ui,"Segoe UI",sans-serif}
.w{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px}
.bg{position:fixed;right:-16vw;top:50%;width:min(980px,110vw);transform:translateY(-50%);opacity:.09;pointer-events:none;z-index:0;-webkit-mask-image:radial-gradient(circle,#000 44%,transparent 47%);mask-image:radial-gradient(circle,#000 44%,transparent 47%)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.brand img{width:36px;height:36px;border-radius:50%}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--amber);color:var(--ink);font-weight:700}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:36px 0 72px}
h1{font-size:clamp(34px,5vw,54px);line-height:1.08;margin:0 0 18px;font-weight:800;letter-spacing:-.02em}
.lead{color:var(--mute);font-size:19px;margin:0 0 28px;max-width:30em}
.btn{display:inline-block;background:var(--amber);color:var(--ink);font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px;font-size:18px}
.btn:hover{background:#f7bb5c}
.btn.alt{background:none;color:var(--text);border:1px solid var(--line);margin-left:10px}
.btn.alt:hover{border-color:var(--amber);background:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--mute)}
.note{margin:16px 0 0;font-size:14px;color:var(--mute);max-width:34em}
/* demo */
.demo{position:relative}
.mon{position:relative;background:#0b1220;border-radius:16px 16px 10px 10px;padding:12px 12px 28px;box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 0 0 2px #2a3a56}.mon::after{content:'';position:absolute;bottom:10px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.scr{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:16/10;background:#fff}
.scr .c{position:absolute;inset:0;padding:14px;color:#1b2433;background:#f7f8fb;font-size:12px;line-height:1.5}
.scr .bar{height:8px;width:40%;background:#c9d3e6;border-radius:4px;margin-bottom:10px}
.scr .ln{height:6px;background:#dde3ef;border-radius:3px;margin:6px 0}
.scr .row{display:flex;gap:8px;margin-top:12px}
.scr .row i{flex:1;height:54px;border-radius:6px}
.scr .code{margin-top:12px;background:#0f1726;color:#9fd0ff;border-radius:6px;padding:8px;font:11px/1.5 Consolas,monospace}
.warm{position:absolute;inset:0;background:#ff9a2e;mix-blend-mode:multiply;pointer-events:none;opacity:0}
.neck{width:13%;height:34px;margin:0 auto;background:linear-gradient(90deg,#1a2740,#2d4063,#1a2740)}.base{width:34%;height:10px;margin:0 auto;background:linear-gradient(#3a4f75,#1c2a44);border-radius:6px 6px 14px 14px}
.pop{font-family:"Segoe UI",system-ui,sans-serif;width:min(310px,92%);margin:20px 0 0 auto;position:relative;background:#f4f4f6;color:#222;border-radius:10px;padding:14px 16px;box-shadow:0 14px 36px rgba(0,0,0,.45)}
.sl{display:grid;grid-template-columns:24px 1fr 30px;align-items:center;gap:10px;margin:2px 0}
.sl svg{width:22px;height:22px}
.sl output{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:18px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#d98a12 var(--v,50%),#ccc var(--v,50%))}
input[type=range]::-moz-range-track{height:2px;background:#ccc}
input[type=range]::-moz-range-progress{height:2px;background:#d98a12}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#d98a12;margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#d98a12}
.prof{display:flex;gap:8px;margin-top:10px}
.prof button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;background:#dcdce0;color:#222;padding:9px;font:inherit;font-size:14px;cursor:pointer}.prof button:hover{background:#d0d0d6}.prof svg{width:16px;height:16px}
.prof #ct{flex:0 0 40px;padding:0}.prof #ct[aria-pressed=true]{background:#f6dfb8}.prof #ct[aria-pressed=true]:hover{background:#efd29a}
.cur{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s;will-change:transform}
.cur svg{display:block;width:22px;height:22px;margin:-2px 0 0 -3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.cur .ring{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:3px solid #f2a93b;border-radius:50%;box-shadow:0 0 16px rgba(242,169,59,.8);opacity:0;transform:scale(.4)}
.cur.down .ring{opacity:.9;transform:scale(.75)}
.cur.burst .ring{animation:rip .6s ease-out}
@keyframes rip{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.cur{display:none}}
.dnote{font-size:13px;color:var(--mute);margin:14px 0 0}
.dnote button{background:none;border:0;color:var(--amber);cursor:pointer;font:inherit;text-decoration:underline;padding:0 0 0 6px}
/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.4vw,36px);margin:0 0 14px;line-height:1.15;letter-spacing:-.01em}
.prob p{max-width:36em;color:var(--mute);font-size:19px;margin:0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:8px}
.cols>div{padding:22px;border:1px solid rgba(242,169,59,.7);border-radius:14px;background:rgba(242,169,59,.05);box-shadow:0 0 0 1px rgba(242,169,59,.12),0 0 28px rgba(242,169,59,.14);transition:border-color .2s,box-shadow .2s}
.cols>div:hover{border-color:var(--amber);box-shadow:0 0 0 1px rgba(242,169,59,.3),0 0 34px rgba(242,169,59,.22)}
.chips li{border-color:rgba(242,169,59,.55)!important;color:var(--text)!important}
@media (prefers-reduced-motion:reduce){.cols>div{transition:none}}
.cols h3{margin:0 0 6px;font-size:19px;color:var(--amber)}
.cols p{margin:0;color:var(--mute);font-size:16px}
.lim ul{margin:0;padding-left:20px;color:var(--mute);max-width:44em}
.lim li{margin:8px 0}
.cta{text-align:center}
.cta p{color:var(--mute);margin:0 0 24px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{color:var(--mute)}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:32px}.cols{grid-template-columns:1fr}.btn.alt{margin:10px 0 0}}
</style>
</head>

 el("warm").style.opacity=cur[1]/100*0.5;
